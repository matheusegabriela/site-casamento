<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite — Escolha seu lado</title>
  <style>
    :root{
      --text: #111;
      --muted: rgba(17,17,17,0.65);
      --card: rgba(255,255,255,0.85);
      --border: rgba(0,0,0,0.14);
      --shadow: 0 18px 60px rgba(0,0,0,0.14);
      --radius: 22px;
      --max: 1100px;
    }

    *{ box-sizing: border-box; }
    body{
      margin: 0;
      font-family: Arial;
      color: var(--text);
      min-height: 100vh;
      background: radial-gradient(1000px 700px at 20% 10%, #ffffff, #f1f1f1);
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .wrap{
      width: 100%;
      max-width: var(--max);
    }

    .top{
      display: grid;
      gap: 6px;
      margin-bottom: 16px;
      text-align: center;
    }

    .title{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }
    .subtitle{
      color: var(--muted);
      font-size: 14px;
    }

    .grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .choice{
      position: relative;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      min-height: 420px;
      display: grid;
      grid-template-rows: 1fr auto;
      transition: transform .10s ease, border .2s ease;
    }

    .choice:hover{
      transform: translateY(-2px);
      border-color: rgba(0,0,0,0.25);
    }

    .hero{
      position: relative;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .img{
      width: 100%;
      height: 100%;
      min-height: 320px;
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,0.12);
      background: linear-gradient(135deg, rgba(0,0,0,0.06), rgba(0,0,0,0.02));
      overflow: hidden;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: rgba(0,0,0,0.45);
      text-align: center;
      padding: 10px;
    }

    /* Você vai trocar o background-image aqui depois */
    .img.noivo{
      background-image: url("assets/img/Noivo.png");
      background-size: 152%;
      background-position: center 40%;
    }

    .img.noiva{
      background-image: url("assets/img/Noiva.png");
      background-size: 157%;
      background-position: center 40%;
    }

    .label{
      padding: 14px 16px;
      display: grid;
      gap: 6px;
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(0,0,0,0.10);
    }

    .label h2{
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .label p{
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .pill{
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2px;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
    }

    .pill.noivo{ border-color: rgba(180, 0, 0, 0.25); }
    .pill.noiva{ border-color: rgba(255, 105, 180, 0.28); }

    .footer{
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px){
      .grid{ grid-template-columns: 1fr; }
      .choice{ min-height: 380px; }
      .title{ font-size: 24px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="title">Divirta-se</div>
      <div class="subtitle">Selecione para abrir o convite com o tema correspondente.</div>
    </div>

    <div class="grid">
      <!-- NOIVO -->
     <a class="choice" href="home.html?tema=noivo">
  <div class="hero">
    <div class="pill noivo">Lado do Noivo</div>

    <div class="img noivo"></div> <!-- ESSA DIV É A IMAGEM -->
  </div>

  <div class="label">
    <h2>Tema do Noivo</h2>
    <p>Que a força esteja com você. Clique para entrar.</p>
  </div>
</a>

      <!-- NOIVA -->
<a class="choice" href="home.html?tema=noiva">
  <div class="hero">
    <div class="pill noiva">Lado da Noiva</div>

    <div class="img noiva"></div> <!-- ESSA DIV É A IMAGEM -->
  </div>

  <div class="label">
    <h2>Tema da Noiva</h2>
    <p>Vivendo o meu para sempre. Clique para entrar.</p>
  </div>
</a>

    </div>

    <div class="footer">
      Dica: você pode voltar e explorar os dois temas
    </div>
  </div>
</body>
</html>
